<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

    <title>at the mirage</title>
    <script>
        // Keep the address clean: atthemirage.com/ rather than index.html
        if (location.hostname.endsWith('atthemirage.com') && /\/index\.html$/.test(location.pathname))
            history.replaceState(history.state, '', location.pathname.replace(/\/index\.html$/, '/') + location.search + location.hash);
    </script>
    <meta name="description" content="photography in the twilight zone...">
    <meta name="theme-color" content="#000000">
    <!-- Link previews (iMessage, Instagram, Discord, X, ...) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="at the mirage">
    <meta property="og:title" content="at the mirage">
    <meta property="og:description" content="photography in the twilight zone...">
    <meta property="og:url" content="https://atthemirage.com/">
    <meta property="og:image" content="https://atthemirage.com/social/preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preload" href="fonts/Vogue.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">

</head>
<body class="splash-page">
    <canvas class="mirage" aria-hidden="true"></canvas>


    <main class="hero">
        <h1 class="title">AT THE MIRAGE</h1>
        <!-- Enter: an arrow whose tail breaks up into heat haze -->
        <a class="enter" href="gallery" aria-label="Enter">
            <svg viewBox="0 0 120 16" aria-hidden="true">
                <g class="haze">
                    <line x1="2" y1="8" x2="6" y2="8" style="--o: 0.18" />
                    <line x1="10" y1="8" x2="17" y2="8" style="--o: 0.32" />
                    <line x1="21" y1="8" x2="31" y2="8" style="--o: 0.5" />
                    <line x1="35" y1="8" x2="47" y2="8" style="--o: 0.72" />
                </g>
                <g class="shaft">
                    <line x1="51" y1="8" x2="112" y2="8" />
                    <path d="M105.5 3.5 L112.5 8 L105.5 12.5" />
                </g>
            </svg>
        </a>
    </main>

    <p class="credit">© 2026 Jagvir</p>

        // The splash page is a single image: no right-click menu here
        document.addEventListener('contextmenu', (event) => event.preventDefault());
