# On every push: rebuild the gallery from the photos in images/ (web-sized copies
# with hidden data such as GPS removed), save those back to the branch, and on
# main publish the site to GitHub Pages -- without the original photos.
#
# One-time setup: repository Settings -> Pages -> Source -> "GitHub Actions".
name: Build and publish

on:
  push:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make the gallery
        run: |
          pip install --quiet pillow pillow-heif
          python tools/build_gallery.py

      - name: Save the gallery to the branch
        run: |
          git add images/gallery js/photos.js p
          if git diff --cached --quiet; then
            echo "Gallery already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "updated gallery 🖼️"
            git push
          fi

      - name: Put the website together, leaving out the original photos
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' --exclude '_site' ./ _site/
          # Only the web copies and the site icons are published from images/: never
          # an original photo, in any folder (they can contain GPS locations)
          find _site/images -mindepth 1 -maxdepth 1 ! -name gallery ! -name favicon -exec rm -rf {} +
          rm -rf "_site/from google"
          # Tag the code and styles with this publish's version, so browsers fetch
          # the new files instead of mixing them with copies they saved earlier
          version="${GITHUB_SHA::8}"
          sed -i -E "s#((src|href)=\"/?(js|css)/[^\"?]+\.(js|css))\"#\1?v=${version}\"#g" _site/*.html
          grep -ho '/\?\(js\|css\)/[^"]*?v=[a-z0-9]*' _site/*.html
          ls -R _site | head -50

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
